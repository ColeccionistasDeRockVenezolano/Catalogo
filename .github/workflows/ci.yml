# CRV · CI (auditoría de pruebas #3 — la suite deja de depender de que alguien
# se acuerde de correrla; nada impide hoy mergear con la suite en rojo).
#
# Tres puertas, cada una con lo que puede correr un runner de GitHub:
#   1. calidad   — tipos, lint, unitarias y cobertura (rápido, bloqueante).
#   2. contratos — PostgreSQL desechable por archivo (Docker del runner).
#   3. web       — tipos y build de la SPA.
#
# `npm run test:matrix` (PG 15 y 16) y `test:deepseek:real` (red + clave) no
# corren aquí a propósito: el primero es de verificación de esquema y se deja
# manual; el segundo gasta cuota real de la API.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# data/research vive en el almacén externo, fuera de Git (docs/SHARED_STORAGE.md):
# el runner carga un inventario de fuentes mínimo para que API y pruebas arranquen.
env:
  CRV_SOURCE_INVENTORY: ${{ github.workspace }}/test/fixtures/source-inventory-ci.json

jobs:
  calidad:
    name: Calidad (tipos, lint, unitarias, cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Lectores PDF y navegador de investigación
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npx playwright install --with-deps chromium
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build backend
        run: npm run build
      - name: Unitarias con cobertura
        run: npm run test:coverage
      - name: Subir informe de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/
          retention-days: 14

  contratos:
    name: Contratos (PostgreSQL desechable)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Dependencias para documentos de investigación
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npx playwright install --with-deps chromium
      # Cada archivo de test/contract levanta su propio postgres:16-alpine en
      # un puerto del host y lo destruye al terminar; los runners traen Docker.
      - run: npm run test:contract

  web:
    name: Web (unitarias, build y navegador con API real)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: web
      - name: Unitarias web
        run: npm run test:web
      - run: npm run build
        working-directory: web
        env:
          VITE_API_BASE_URL: /api
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Navegador, sesiones, permisos y edición
        run: npm run test:browser
      - name: Investigación recuperable, sesión y controles
        run: npm run test:browser:research
