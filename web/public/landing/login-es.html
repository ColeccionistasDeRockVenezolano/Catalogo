<body class="login-body">
<main class="login-main">
  <div class="login-card">
    

  <span class="brand-logo brand-logo--lg" aria-hidden="true"><img src="landing/crv-logo.jpg" alt="" width="160" height="160"></span>


    <h1>Entrar al roadmap</h1>
    <p class="login-sub">Usa el nombre de usuario y la clave de tu cuenta aprobada en <strong>Coleccionistas De Rock Venezolano</strong>.</p>
    
    <form method="post" action="../api/auth/login" class="login-form">
      <div class="field">
        <label for="name">Nombre de usuario</label>
        <input type="text" id="name" name="name" maxlength="80" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="accessCode">Tu clave</label>
        <input type="password" id="accessCode" name="accessCode" maxlength="200" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-red btn-block">Entrar</button>
    </form>
    <p class="login-sub">¿Tienes un enlace de invitación? <a href="../registro">Regístrate aquí</a>.</p>
    <a class="login-back" href="../roadmap"><i data-lucide="arrow-left"></i> Volver al roadmap</a>
  </div>
</main>
