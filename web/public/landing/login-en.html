<body class="login-body">
<main class="login-main">
  <div class="login-card">
    

  <span class="brand-logo brand-logo--lg" aria-hidden="true"><img src="landing/crv-logo.jpg" alt="" width="160" height="160"></span>


    <h1>Sign in to the roadmap</h1>
    <p class="login-sub">Use the username and passphrase of your approved account in <strong>Coleccionistas De Rock Venezolano</strong>.</p>
    
    <form method="post" action="../api/auth/login" class="login-form">
      <div class="field">
        <label for="name">Username</label>
        <input type="text" id="name" name="name" maxlength="80" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="accessCode">Your passphrase</label>
        <input type="password" id="accessCode" name="accessCode" maxlength="200" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-red btn-block">Sign in</button>
    </form>
    <p class="login-sub">Do you have an invitation link? <a href="../registro">Sign up here</a>.</p>
    <a class="login-back" href="../roadmap"><i data-lucide="arrow-left"></i> Back to the roadmap</a>
  </div>
</main>
<script src="landing/login.js"></script>
</body>
